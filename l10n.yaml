# Configuración de gen-l10n (flutter gen-l10n / build con `generate: true`).
# ARB base = inglés (fallback explícito para vi incompleto); la clase generada es `Strings` (AppLocalizations).
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: Strings
nullable-getter: false
