name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [ios-port]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.omegabrotein.hermesconsole
      TEAM_ID: 4ZJ6JD9QV9
      KEY_ID: AV4SGHFHL5
      ISSUER_ID: e750daa2-82eb-49ce-a10b-4a128bba210f
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - run: flutter --version && xcodebuild -version

      - run: flutter pub get

      - name: Import signing identity into keychain
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$IOS_DIST_P12_BASE64" | base64 -d > dist.p12
          security create-keychain -p build build.keychain-db
          security import dist.p12 -k build.keychain-db -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s build.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k build build.keychain-db >/dev/null
          rm dist.p12
          security find-identity -v -p codesigning build.keychain-db | head -3

      - name: Install provisioning profile
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          cat > fetch_profile.py <<'PY'
          import base64, json, os, time, urllib.request, jwt
          tok = jwt.encode({"iss": os.environ["ISSUER_ID"],
                            "aud": "appstoreconnect-v1",
                            "exp": int(time.time()) + 1200},
                           os.environ["ASC_KEY_P8"], algorithm="ES256",
                           headers={"kid": os.environ["KEY_ID"]})
          def api(path):
              req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path,
                  headers={"Authorization": f"Bearer {tok}"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  raise SystemExit(f"ASC {path} -> {e.code} {e.read().decode()[:300]}")
          bid = api(f"/v1/bundleIds?filter[identifier]={os.environ['BUNDLE_ID']}")["data"][0]["id"]
          profs = api(f"/v1/profiles?filter[bundleId]={bid}&filter[profileType]=IOS_APP_STORE")["data"]
          p = sorted(profs, key=lambda x: x["attributes"]["createdDate"])[-1]
          import pathlib
          out = pathlib.Path.home()/"Library/MobileDevice/Provisioning Profiles"/"hermesconsole.mobileprovision"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(base64.b64decode(p["attributes"]["profileContent"]))
          print("installed profile", p["id"], "->", out)
          PY
          python3 fetch_profile.py

      - name: Build and sign iOS app
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstore
          echo "$ASC_KEY_P8" > ~/.appstore/AuthKey.p8
          chmod 600 ~/.appstore/AuthKey.p8
          xcrun altool --upload-app -f build/ios/ipa/*.ipa \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" \
            --verbose 2>&1 | tail -30
