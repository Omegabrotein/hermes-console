name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [ios-port]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.omegabrotein.hermesconsole
      TEAM_ID: 4ZJ6JD9QV9
      KEY_ID: AV4SGHFHL5
      ISSUER_ID: e750daa2-82eb-49ce-a10b-4a128bba210f
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - run: flutter --version && xcodebuild -version

      - run: flutter pub get

      - name: Import signing identity into keychain
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$IOS_DIST_P12_BASE64" | base64 -d > dist.p12
          security create-keychain -p build build.keychain-db
          security import dist.p12 -k build.keychain-db -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security unlock-keychain -p build build.keychain-db
          security set-keychain-settings -lut 3600 build.keychain-db
          security list-keychain -d user -s build.keychain-db login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k build build.keychain-db >/dev/null
          rm dist.p12
          security find-identity -v -p codesigning build.keychain-db | head -3

      - name: Install provisioning profile
        env:
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          echo "$IOS_PROFILE_BASE64" | base64 -d > "$dir/hermesconsole.mobileprovision"
          security cms -D -i "$dir/hermesconsole.mobileprovision" | grep -A1 '<key>Name</key>'

      # ponytail: Apple treats any bundled file starting with "#!" as unsigned
      # code and rejects the upload. The bridge runs as `python3 file`, so the
      # shebang is dropped in the iOS build only (Android asset untouched).
      - name: Strip shebang from bundled scripts
        run: |
          for f in $(grep -rlI '^#!' assets); do sed -i '' '1{/^#!/d;}' "$f"; echo "stripped $f"; done
          chmod -R a-x+X assets
          # Apple's upload validator flags bundled .py files as unsigned code.
          # Rename the bridge asset for the iOS build only; Dart loads it as text.
          git mv assets/bridge/hermes_bridge.py assets/bridge/hermes_bridge.py.txt
          grep -rl "assets/bridge/hermes_bridge.py" lib pubspec.yaml | xargs sed -i '' "s#assets/bridge/hermes_bridge.py#assets/bridge/hermes_bridge.py.txt#g"
          grep -rn "assets/bridge/hermes_bridge" lib pubspec.yaml
          xattr -cr assets
          ls -l assets/bridge/

      - name: Build and sign iOS app
        run: |
          flutter build ipa --release \
            --build-number=$((10000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT)) \
            --export-options-plist=ios/ExportOptions.plist

      - name: Inspect bundled script in signed app
        run: |
          app=$(find build/ios/archive -name Runner.app -type d | head -1)
          f="$app/Frameworks/App.framework/flutter_assets/assets/bridge/hermes_bridge.py.txt"
          ls -l@ "$f"; file "$f"; head -c 120 "$f"; echo
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tail -5
          grep -c "hermes_bridge.py" "$app/Frameworks/App.framework/_CodeSignature/CodeResources" || true

      - name: Upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
