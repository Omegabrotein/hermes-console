name: Android QA APK

# ponytail: profile-mode qa flavor, debug-signed, side-by-side install
# (dev.xpetalab.hermesconsole.qa). Switch to release once a real upload key
# is in secrets (key.properties is required for any *Release task).
on:
  workflow_dispatch:
  push:
    branches: [ios-port]

permissions:
  contents: read

concurrency:
  group: android-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --profile --flavor qa --split-per-abi --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-console-qa-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
