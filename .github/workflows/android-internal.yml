name: Android Internal (Play) AAB

# ponytail: family-distribution lane. Builds the `play` flavor as a signed AAB,
# uploads it as a workflow artifact and (when secrets are present) hands it off
# to Play Internal Track. Designed to NEVER cause the "conflicts with existing
# app" install error: the play flavor shares applicationId with full, so it
# updates in place — IF the signing key matches what Play already has on file.
# The upload key is supplied via GitHub secrets (see README) and decodes to
# android/key.properties + android/upload.keystore at build time.
on:
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: "Upload AAB to Google Play Internal Track"
        type: boolean
        default: false
  push:
    branches: [ios-port]

permissions:
  contents: read

concurrency:
  group: android-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install signed key from secrets
        if: ${{ env.ANDROID_KEY_PROPERTIES != '' }}
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEY_PROPERTIES" > android/key.properties
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > android/upload.keystore
          chmod 600 android/key.properties android/upload.keystore
          echo "upload.keystore bytes=$(wc -c < android/upload.keystore)"

      - name: Build signed Play AAB
        run: |
          if [ -f android/key.properties ]; then
            flutter build appbundle --release --flavor play
          else
            # ponytail: keystore missing — build unsigned AAB so this workflow
            # never silently breaks CI. The validator in build.gradle.kts is
            # opt-out via -PrequireReleaseSigning=false.
            flutter build appbundle --release --flavor play --no-shrink -PrequireReleaseSigning=false
            echo "::warning::android/key.properties missing; AAB is unsigned. Set GitHub secrets ANDROID_KEY_PROPERTIES + ANDROID_UPLOAD_KEYSTORE_BASE64 to enable signed builds."
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-console-play-aab
          path: build/app/outputs/bundle/playRelease/*.aab
          retention-days: 30
