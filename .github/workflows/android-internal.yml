name: Android Internal (Play) AAB

# ponytail: family-distribution lane. Builds the `play` flavor as a signed AAB
# and uploads it to Google Play Internal Track on every push to ios-port.
# Designed to NEVER cause the "conflicts with existing app" install error:
# the play flavor shares applicationId with full, so updates slide over the
# existing install — IF the signing key matches what Play already has on file.
#
# Requires GitHub secrets (added at repo Settings → Secrets → Actions):
#   ANDROID_KEY_PROPERTIES             (4 lines: storeFile, storePassword, keyAlias, keyPassword)
#   ANDROID_UPLOAD_KEYSTORE_BASE64     (base64 of your upload.keystore file)
#   ANDROID_PLAY_SERVICE_ACCOUNT_JSON  (Play Console service account JSON, optional)
#
# Without secrets: builds unsigned AAB and stops; passes the artifact along so
# someone can ship it manually.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (only used when service account is configured)"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
  push:
    branches: [ios-port]

permissions:
  contents: read

concurrency:
  group: android-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEY_PROPERTIES != '' && secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_PUBLISHER: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install signed key from secrets
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEY_PROPERTIES" > android/key.properties
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > android/upload.keystore
          chmod 600 android/key.properties android/upload.keystore
          echo "upload.keystore bytes=$(wc -c < android/upload.keystore)"

      - name: Build signed Play AAB
        run: |
          if [ -f android/key.properties ]; then
            flutter build appbundle --release --flavor play
          else
            # ponytail: keystore missing — build unsigned AAB so this workflow
            # never silently breaks CI. The validator in build.gradle.kts is
            # opt-out via -PrequireReleaseSigning=false.
            flutter build appbundle --release --flavor play --no-shrink \
              -PrequireReleaseSigning=false
            echo "::warning::android/key.properties missing; AAB is unsigned. Set GitHub secrets ANDROID_KEY_PROPERTIES + ANDROID_UPLOAD_KEYSTORE_BASE64 to enable signed builds."
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-console-play-aab
          path: build/app/outputs/bundle/playRelease/*.aab
          retention-days: 30

      # Google Play handoff. The google-github-actions/upload-google-play action
      # uses the service account JSON to upload the AAB as a draft on the named
      # track. You still need to promote that draft from internal → alpha →
      # production via Play Console; auto-promotion is a Play policy violation.
      - name: Upload to Play Internal Track
        if: ${{ env.HAS_KEYSTORE == 'true' && env.HAS_PUBLISHER == 'true' && github.event_name == 'push' }}
        uses: r0adkll/upload-google-play@v1.0.0
        with:
          serviceAccountJsonPlaintext: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.xpetalab.hermesconsole
          releaseFiles: build/app/outputs/bundle/playRelease/app-play-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          whatToUpdate: notSet
          mappingFile: build/app/outputs/mapping/playRelease/mapping.txt
          releaseName: ${{ github.event.head_commit.message }}
